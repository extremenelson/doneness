name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so no go.sum to key a cache on
      # Runs the linter (with PR annotations) and leaves it on PATH for
      # `make check`.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      # The scaffold tests use `git worktree add --orphan` (git 2.42+).
      - run: git --version
      - run: make check
